<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begin</title>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/role.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/role.css">
</head>
<body>
    <div id="hostIntroBoard">
        <button onclick="claimHost()">Back to player</button>
        <button onclick="startGame()">Start game</button>
        <button onclick="copyId()">Copy ID</button>
        <div id="playerConfig">

        </div>
    </div>
    <div id="playerIntroBoard">
        <button id="hostClaimBtn" onclick="claimHost()">Claim host</button>
        <input id="name" type="text" placeholder="name">
        <input id="code" type="text" placeholder="code">
        <button id="joinGameBtn" onclick="joinGame()">Join Game!</button>
        <h2>Players</h2>
        <ol id="playerList">
            
        </ol>
    </div>

    <dialog id="roleSelect" class="roleMenuDialog" closedby="any">
        <div class="roleMenu">
        </div>
        <button>WHat</button>
        
    </dialog>


    <button onclick="setRole()"></button>
    
    <div id="playerPlayingBoard">
        
    </div>

    <div id="chatDiv">
        <input id="chatInput" type="text">
        <button onclick="sendMsg(document.getElementById('chatInput').value)">Send</button>
        <div id="chatError">
            <p> Please only use letters, numbers, spaces, or these symbols: , . ! ? </p>
        </div>
        <div id="chatHistory">

        </div>
    </div>
    
</body>
</html>
