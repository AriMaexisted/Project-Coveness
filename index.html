<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begin</title>
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/role.js" defer></script>
    <script src="js/game.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/role.css">
</head>
<body>
    <div id="hostIntroBoard">
        <button onclick="claimHost()">Back to player</button>
        <button onclick="startGame()">Start game</button>
        <button onclick="copyId()">Copy ID</button>
        <div id="playerConfig">

        </div>
    </div>
    <div id="playerIntroBoard">
        <button id="hostClaimBtn" onclick="claimHost()">Claim host</button>
        <input id="name" type="text" placeholder="name">
        <input id="code" type="text" placeholder="code">
        <button id="joinGameBtn" onclick="joinGame()">Join Game!</button>
        <h2>Players</h2>
        <div id="playerList">
            
        </div>
        <div id="avatarCreatorDiv">
            <div>
                <button onclick="avatarChange(0, 'changer')">&lt;</button>
                <button onclick="avatarChange(1, 'changer')">&lt;</button>
                <button onclick="avatarChange(2, 'changer')">&lt;</button>
            </div>
            <div class="avatarWrapper" style="height:100px;">
                <img class="avatarT changer" style="z-index: 3;" src="images/avatar/T0.svg"></img>
                <img class="avatarB changer" style="z-index: 2;" src="images/avatar/B0.svg"></img>
                <img class="avatarC changer" style="z-index: 1;" src="images/avatar/C0.svg"></img>
            </div>
            <div>
                <button onclick="avatarChange(3, 'changer')">&gt;</button>
                <button onclick="avatarChange(4, 'changer')">&gt;</button>
                <button onclick="avatarChange(5, 'changer')">&gt;</button>
            </div>
            <div>
                <button onclick="randomAvatar()">Random</button>
            </div>
        </div>
    </div>

    <dialog id="roleSelect" class="roleMenuDialog" closedby="any">
        <div class="roleMenu">
        </div>
        <p>Selected role:</p>
        <p id="selRole"></p>
        <button onclick="submitRole()">Submit</button>
        
    </dialog>


    <dialog id="whisperPlayerList" closedby="any">

    </dialog>


    <!-- <button onclick="setRole()"></button>
    <button onclick="gameStart('Investigator')"></button> -->
    
    <div id="playerPlayingBoard">
        
        <div id="roleReveal">
            <h3 id="roleRevealIntro">Your role is...</h3>
            <img id="roleRevealCards">
            <p id="roleRevealSubtext"></p>
        </div>

        <div id="playingMenu">
            <div id="topBar">
                <div id="playerTabs">
                    <button onclick="switchTabs('Players')">Players</button>
                    <button onclick="switchTabs('Graveyard')">Graveyard</button>
                    <button onclick="switchTabs('LastWill')">Last Will</button>
                    <button onclick="switchTabs('DeathNote')" id="DeathNote">Death Note</button>
                </div>
                <div id="topBarContent">
                    <div id="playerList">

                    </div>
                    <div id="graveyard">

                    </div>
                    <div id="lastWill">

                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="chatDiv">
        <div id="chatInputWrapper">
            <button onclick="whisper()">Whisper</button>
            <input id="chatInput" type="text" placeholder="Type here">
            <button onclick="sendMsg(document.getElementById('chatInput').value)">Send</button>
        </div>
        <div id="chatError">
            <p> Please only use letters, numbers, spaces, or these symbols: , . ! ? </p>
        </div>
        <div id="chatHistory">
            <p>AAAAAAAAAAAAA</p>
        </div>
    </div>
    
</body>
</html>
